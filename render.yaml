services:
  - type: web
    name: see-market-backend
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./see_market.db
      - key: GEMMA_MODEL
        value: gemma-4-31b-it
