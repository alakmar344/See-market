services:
  - type: web
    name: see-market-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGIN
        value: https://see-market.vercel.app
      - key: FINNHUB_API_KEY
        sync: false
